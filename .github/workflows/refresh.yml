name: Refresh dashboard data

on:
  push:
    branches: [main]
    paths: [index.html]     # a page edit reaches Compass Hub without waiting for the daily run
  workflow_dispatch:        # allows manual runs from the Actions tab (used for testing)
  schedule:
    - cron: '0 6 * * *'     # daily at 06:00 UTC (~09:00 Arabia time)

permissions:
  contents: write           # allow the job to commit data.json back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service-account key
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/sa.json"

      - name: Fetch data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: python scripts/fetch_data.py

      # Compass Hub serves this dashboard behind its login (Hub → SEO). Send it the fresh data and
      # the page. Inert until both secrets exist; a Hub outage never fails the data refresh.
      - name: Send data and page to Compass Hub
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SEO_TOKEN: ${{ secrets.HUB_SEO_TOKEN }}
        run: |
          if [ -z "$HUB_URL" ] || [ -z "$HUB_SEO_TOKEN" ]; then
            echo "::notice title=Compass Hub not configured::Set HUB_URL and HUB_SEO_TOKEN repo secrets to send this dashboard to Compass Hub."
            exit 0
          fi
          for f in data:data.json page:index.html; do
            kind="${f%%:*}"; file="${f#*:}"
            code=$(curl -sS -o /tmp/hub.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $HUB_SEO_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" "$HUB_URL/api/seo/upload?file=$kind" || echo 000)
            echo "$file -> Hub: HTTP $code $(cat /tmp/hub.out 2>/dev/null)"
            [ "$code" = "200" ] || echo "::warning title=Compass Hub upload failed::$file returned HTTP $code"
          done

      - name: Commit updated data.json
        run: |
          git config user.name "compass-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
