<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23201c1a'/%3E%3Crect x='6' y='19' width='5' height='7' fill='%23a89e97'/%3E%3Crect x='13.5' y='13' width='5' height='13' fill='%23a89e97'/%3E%3Crect x='21' y='7' width='5' height='19' fill='%23c02a10'/%3E%3C/svg%3E">
<title>Compass Group — SEO Performance Dashboard</title>
<style>
/* Self-hosted so the page has no third-party requests: it carries commercial
   figures and is moving behind an auth gate, where a font call to a CDN would
   leak the referrer. Both families are variable, so one file covers every
   weight the design uses. */
@font-face {
  font-family: 'Montserrat';
  src: url('fonts/montserrat-latin-var.woff2') format('woff2');
  font-weight: 500 700;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url('fonts/archivo-latin-var.woff2') format('woff2');
  font-weight: 400 700;
  font-display: swap;
}

/* Light is the approved design. The noir variant is opt-in via
   <html data-theme="noir"> rather than prefers-color-scheme, because this sheet
   is regularly exported as an image and the export should not depend on whose
   laptop rendered it. */
:root {
  --desk:        #d5d1ce;
  --sheet:       #fbf9f7;
  --tint:        #f6f3f0;
  --alert:       #f9ece8;
  --alert-div:   #e8d8d2;
  --ink:         #201c1a;
  --ink-hair:    #4a4441;
  --on-ink:      #f0ebe8;
  --on-ink-mute: #b3aba7;
  --text:        #201c1a;
  --strong:      #3f3a37;
  --body:        #55504c;
  --muted:       #6f6862;
  --muted-alert: #665f5a;
  --divider:     #cdc6c1;
  --sheet-edge:  #c7c0bb;
  --hair:        #e9e4e0;
  --hair-tint:   #e2ddd8;
  --bar-neutral: #a89e97;
  --tick-steady: #c2b9b3;
  --accent:      #c02a10;
  --shadow:      0 18px 48px rgba(32,28,26,0.16);
}
:root[data-theme="noir"] {
  --desk:        #0b0908;
  --sheet:       #14100e;
  --tint:        #1d1512;
  --alert:       #1d1512;
  --alert-div:   #3a322c;
  --ink:         #0b0908;
  --ink-hair:    #3a322c;
  --on-ink:      #f0e9df;
  --on-ink-mute: #8a7f75;
  --text:        #f0e9df;
  --strong:      #cfc5ba;
  --body:        #b8ada2;
  --muted:       #8a7f75;
  --muted-alert: #8a7f75;
  --divider:     #3a322c;
  --sheet-edge:  #3a322c;
  --hair:        #262019;
  --hair-tint:   #262019;
  --bar-neutral: #4a4038;
  --tick-steady: #4a4038;
  --accent:      #ff4a2b;
  --shadow:      none;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--text);
  font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* Radius 0 everywhere. Load-bearing to the aesthetic — do not soften. */
img, div, span, table { border-radius: 0; }

.sheet {
  width: 1120px;
  margin: 36px auto;
  background: var(--sheet);
  border: 1px solid var(--sheet-edge);
  box-shadow: var(--shadow);
}
.mono  { font-family: 'Montserrat', system-ui, sans-serif; }
.num   { font-variant-numeric: tabular-nums; }
.right { text-align: right; }

/* --- masthead -------------------------------------------------------- */
.masthead {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; padding: 16px 36px; background: var(--ink);
}
.masthead-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.masthead-left img { height: 40px; display: block; flex: none; }
.vrule { width: 1px; height: 24px; background: var(--ink-hair); flex: none; }
.masthead-title {
  font-weight: 600; font-size: 12px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--on-ink); white-space: nowrap;
}
.chips {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--on-ink-mute);
}
.chip { border: 1px solid var(--ink-hair); padding: 4px 9px; white-space: nowrap; }
.chip-date {
  background: var(--accent); color: var(--sheet); padding: 4px 9px;
  font-weight: 600; white-space: nowrap; border: 0;
}

/* --- hero ------------------------------------------------------------ */
.split {
  display: grid; grid-template-columns: 1.48fr 1px 1fr;
  position: relative; overflow: hidden;
}
.divider { background: var(--divider); }
.hero { border-bottom: 1px solid var(--divider); }
.watermark {
  position: absolute; right: 30%; top: -90px; width: 380px;
  opacity: 0.05; pointer-events: none;
}
:root[data-theme="noir"] .watermark { opacity: 0.045; }
.hero-left  { position: relative; padding: 32px 36px 26px; }
.hero-right { position: relative; padding: 32px 36px 26px; background: var(--tint); }

.kicker { width: 44px; height: 3px; background: var(--accent); margin-bottom: 18px; }
.headline {
  font-weight: 700; font-size: 42px; line-height: 1.06;
  letter-spacing: -0.024em; max-width: 17ch; text-wrap: pretty;
}
.metrics {
  display: flex; align-items: flex-end; gap: 30px;
  margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--divider);
}
.lead-row { display: flex; align-items: flex-start; gap: 10px; }
.lead {
  font-weight: 700; font-size: 68px; line-height: 0.86; letter-spacing: -0.04em;
}
.delta-chip {
  background: var(--ink); color: var(--sheet); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; padding: 3px 7px; margin-top: 4px; white-space: nowrap;
}
:root[data-theme="noir"] .delta-chip { background: var(--strong); color: var(--sheet); }
.caption {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); margin-top: 12px;
}
.secondaries { display: flex; padding-bottom: 4px; }
.secondary { padding: 0 20px; border-left: 1px solid var(--hair-tint); }
.secondary:last-child { padding-right: 0; }
.secondary-val {
  font-weight: 600; font-size: 27px; line-height: 1;
  letter-spacing: -0.022em; color: var(--strong);
}
.secondary-den { font-size: 17px; color: var(--muted); }
.secondary .caption { margin-top: 7px; }

/* --- position chart -------------------------------------------------- */
.chart-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 4px;
}
.chart-label {
  font-weight: 600; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
}
.chart-hint { font-size: 11px; color: var(--muted); }
.chart-value-row { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 16px; }
.chart-value { font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.03em; }
.chart-from { font-size: 12px; color: var(--body); }
.chart-grid { display: grid; grid-template-columns: 40px 1fr; gap: 10px; }
/* These two labels are not decoration: average position improves as the number
   falls, so without them the rising line reads as the metric getting worse. */
.chart-gutter {
  display: flex; flex-direction: column; justify-content: space-between;
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); text-align: right; padding: 2px 0 16px;
}
.chart-dates {
  display: flex; justify-content: space-between; font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 8px;
}
.chart-note {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair-tint);
  font-size: 12.5px; line-height: 1.6; color: var(--body); text-wrap: pretty;
}

/* --- alert band ------------------------------------------------------ */
.alert { background: var(--alert); border-bottom: 1px solid var(--divider); }
.alert .divider { background: var(--alert-div); }
.alert-left { display: flex; gap: 18px; padding: 20px 36px; }
.alert-bar { width: 3px; background: var(--accent); flex: none; }
.alert-label {
  font-weight: 600; font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
}
.alert-headline {
  font-weight: 600; font-size: 21px; line-height: 1.32;
  letter-spacing: -0.014em; text-wrap: pretty;
}
.alert-meta { font-size: 12px; color: var(--muted-alert); margin-top: 9px; }
.alert-right {
  padding: 20px 36px; display: flex; flex-direction: column;
  justify-content: center; gap: 10px;
}
.watch-label {
  font-weight: 600; font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted-alert);
}
.watch-list { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--body); }
.watch-row { display: flex; gap: 9px; }
.watch-dash { color: var(--accent); font-weight: 700; }
.watch-name { color: var(--text); font-weight: 600; }

/* --- property table -------------------------------------------------- */
.table { padding: 0 36px; }
.trow {
  display: grid; grid-template-columns: 1fr 150px 84px 78px 96px;
  gap: 16px; align-items: center;
}
.thead {
  align-items: baseline; padding: 14px 0 9px;
  /* Heavier than the row rules on purpose: this is the one structural line. */
  border-bottom: 1px solid var(--ink);
  font-weight: 600; font-size: 9.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted);
}
:root[data-theme="noir"] .thead { border-bottom-color: var(--divider); }
.group { display: flex; align-items: center; gap: 10px; padding: 15px 0 7px; }
.group.steady { padding-top: 18px; }
.group-tick { width: 18px; height: 2px; background: var(--accent); }
.group.steady .group-tick { background: var(--tick-steady); }
.group-name {
  font-weight: 600; font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
}
.group.steady .group-name { color: var(--muted); }
.prow { padding: 11px 0; border-bottom: 1px solid var(--hair); }
.prow:last-child { border-bottom: 0; }
.pname { font-size: 15px; font-weight: 600; }
.psub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.track { height: 7px; background: var(--hair); }
.fill { height: 7px; background: var(--bar-neutral); }
.fill.acting { background: var(--accent); }
.pclicks { font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
.pvs { font-size: 13px; font-weight: 600; color: var(--body); }
.pvs.bad { color: var(--accent); }
.pqueue { font-size: 12px; color: var(--muted); }
.pqueue.thin { color: var(--accent); font-weight: 600; }

/* --- footer panels --------------------------------------------------- */
.panels {
  display: grid; grid-template-columns: 1fr 1px 1fr;
  margin-top: 24px; border-top: 1px solid var(--divider);
}
.panel-l { padding: 22px 36px 26px; }
.panel-r { padding: 22px 36px 26px; background: var(--tint); }
.panel-title {
  font-weight: 600; font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; margin-bottom: 14px;
}
.wins { display: flex; flex-direction: column; gap: 11px; }
.win {
  display: grid; grid-template-columns: 20px 1fr auto;
  align-items: baseline; gap: 12px; font-size: 13px;
}
.win-rank { font-weight: 600; font-size: 11px; color: var(--accent); }
.win-fig { color: var(--muted); white-space: nowrap; }
.sources { display: flex; flex-direction: column; gap: 11px; }
.source-head {
  display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px;
}
.source-val { color: var(--muted); }
.source-track { height: 7px; background: var(--hair-tint); }
/* Organic is the only channel search work moves, so it is the only one coloured. */
.source-fill { height: 7px; background: var(--bar-neutral); }
.source-fill.organic { background: var(--accent); }

/* --- footer ---------------------------------------------------------- */
.foot {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 12px 36px; background: var(--ink); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--on-ink-mute);
}
.psub-queue { display: none; }
.stale { color: var(--accent); font-weight: 600; }

/* --- states ---------------------------------------------------------- */
.msg { padding: 40px 36px; font-size: 13px; color: var(--body); }

/* --- responsive ------------------------------------------------------ */
@media (max-width: 1180px) {
  .sheet { width: auto; max-width: 1120px; margin: 20px 16px; }
}
@media (max-width: 1000px) {
  /* Hero and alert go single column; the chart sits under the headline. */
  .split { grid-template-columns: 1fr; }
  .split > .divider { display: none; }
  .hero-right, .panel-r { border-top: 1px solid var(--divider); }
  .watermark { right: -40px; }
  .headline { font-size: 34px; }
  .lead { font-size: 56px; }
  .panels { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  /* Share of clicks is the first thing to go: it is a comparison aid, not data
     you cannot get elsewhere on the row. */
  .trow { grid-template-columns: 1fr 84px 78px; }
  .trow > .col-share { display: none; }
  .trow > .col-queue { display: none; }
  .psub-queue { display: inline; }
  .secondaries { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 0; }
  .secondary { border-left: 0; padding: 0 20px 0 0; }
  .metrics { flex-direction: column; align-items: flex-start; gap: 22px; }
}
@media (max-width: 620px) {
  .masthead, .foot { flex-direction: column; align-items: flex-start; gap: 12px; }
  .headline { font-size: 28px; }
  .lead { font-size: 44px; }
  .table, .hero-left, .hero-right, .panel-l, .panel-r,
  .alert-left, .alert-right, .masthead, .foot { padding-left: 20px; padding-right: 20px; }
}
@media print {
  body { background: #fff; }
  .sheet { margin: 0; width: auto; border: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="msg" id="msg">Loading…</div>
</div>

<script>
'use strict';

/* Every figure on this sheet is derived here from data.json. Nothing is typed
   into the markup, including the editorial sentences — the design's power is
   that it states a conclusion, and a hardcoded conclusion is a lie the moment
   the data moves. */

var D = null;

var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
var n0 = function (v) { return v == null ? '—' : Number(v).toLocaleString('en-US'); };
var pctStr = function (v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '%'; };
var shortName = function (label) { return String(label).replace(/^Compass\s+/, ''); };
var fmtDate = function (iso) {
  var d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
};

/* ---------- derivation ---------- */

function derive(d) {
  var S = d.SITES || {}, B = d.BLOG || {}, RH = d.RANKHIST || {};
  var keys = Object.keys(S);

  var clicks = sum(keys.map(function (k) { return (S[k].cur && S[k].cur.clicks) || 0; }));
  var prevClicks = sum(keys.map(function (k) { return (S[k].prev && S[k].prev.clicks) || 0; }));
  var impr = sum(keys.map(function (k) { return (S[k].cur && S[k].cur.impr) || 0; }));
  var sessions = sum(keys.map(function (k) { return (S[k].ga4 && S[k].ga4.sessions) || 0; }));
  var ranking = sum(keys.map(function (k) { return (S[k].queries || []).filter(function (q) { return q[4] != null; }).length; }));
  var tracked = sum(keys.map(function (k) { return (S[k].queries || []).length; }));
  var delta = prevClicks ? (clicks - prevClicks) / prevClicks * 100 : null;

  // Mean position across the properties that have history, per date.
  var withHist = keys.filter(function (k) { return RH[k] && RH[k].GCC && RH[k].GCC.length; });
  var dates = withHist.length ? RH[withHist[0]].GCC.map(function (p) { return p[0]; }) : [];
  var series = dates.map(function (date, i) {
    var vals = withHist.map(function (k) { var p = RH[k].GCC[i]; return p ? p[1] : null; })
                       .filter(function (v) { return v != null; });
    return { date: date, value: vals.length ? sum(vals) / vals.length : null };
  }).filter(function (p) { return p.value != null; });

  var maxClicks = Math.max.apply(null, keys.map(function (k) { return (S[k].cur && S[k].cur.clicks) || 0; }).concat([1]));

  var rows = keys.map(function (k) {
    var s = S[k], q = s.queries || [], cur = (s.cur && s.cur.clicks) || 0;
    var prev = s.prev ? s.prev.clicks : null;
    var rank = q.filter(function (x) { return x[4] != null; }).length;
    var weeks = B[k] ? B[k].weeks : null;
    var vs = prev ? Math.round((cur - prev) / prev * 100) : null;
    return {
      key: k, label: s.label || k, short: shortName(s.label || k),
      clicks: cur, prevClicks: prev, vs: vs,
      impr: (s.cur && s.cur.impr) || 0, prevImpr: s.prev ? s.prev.impr : null,
      ctr: s.cur ? s.cur.ctr : null, prevCtr: s.prev ? s.prev.ctr : null,
      pos: s.cur ? s.cur.pos : null, prevPos: s.prev ? s.prev.pos : null,
      share: Math.round(cur / maxClicks * 100),
      ranking: rank, tracked: q.length,
      sessions: s.ga4 ? s.ga4.sessions : null,
      weeks: weeks,
      // Act on a property that is losing clicks, about to run out of content,
      // or invisible for every keyword it targets.
      acting: (vs != null && vs < 0) || (weeks != null && weeks < 3.5) || rank === 0
    };
  }).sort(function (a, b) { return (a.vs == null ? 1e9 : a.vs) - (b.vs == null ? 1e9 : b.vs); });

  var wins = keys.reduce(function (acc, k) {
    (S[k].queries || []).forEach(function (q) {
      if (q[4] != null && q[4] >= 4 && q[4] <= 20) acc.push({ q: q[0], impr: q[2], pos: q[4] });
    });
    return acc;
  }, []).sort(function (a, b) { return b.impr - a.impr; }).slice(0, 4);

  var chAgg = {};
  keys.forEach(function (k) {
    ((S[k].ga4 && S[k].ga4.channels) || []).forEach(function (c) {
      chAgg[c[0]] = (chAgg[c[0]] || 0) + c[1];
    });
  });
  // Percentages are of total sessions, not of the channel sum: GA4's channel
  // breakdown does not reconcile with its own session total.
  var channels = Object.keys(chAgg).map(function (name) {
    return { name: name, sessions: chAgg[name], pct: sessions ? chAgg[name] / sessions * 100 : 0 };
  }).sort(function (a, b) { return b.sessions - a.sessions; }).slice(0, 4);

  return {
    clicks: clicks, prevClicks: prevClicks, delta: delta, impr: impr, sessions: sessions,
    ranking: ranking, tracked: tracked, series: series, rows: rows, wins: wins,
    channels: channels, sitesWithGa4: keys.filter(function (k) { return S[k].ga4; }).length,
    siteCount: keys.length, generated: d.generated
  };
}

/* ---------- generated copy ----------
   Kept to phrasings that cannot become false: a fraction is only named when the
   number really is within half a point of it, and every claim is a figure from
   the file rather than a characterisation of it. */

var FRACTIONS = [
  [100, 'double'], [75, 'three quarters'], [66.67, 'two thirds'], [50, 'a half'],
  [33.33, 'a third'], [25, 'a quarter'], [20, 'a fifth'], [16.67, 'a sixth'], [14.29, 'a seventh']
];
function fraction(pct) {
  for (var i = 0; i < FRACTIONS.length; i++) {
    if (Math.abs(pct - FRACTIONS[i][0]) <= 0.5) return FRACTIONS[i][1];
  }
  return null;
}

function headline(m) {
  var a;
  if (m.delta == null) { a = 'Clicks at ' + n0(m.clicks); }
  else {
    var mag = Math.abs(m.delta), f = fraction(mag);
    var dir = m.delta > 0 ? 'up' : m.delta < 0 ? 'down' : 'flat';
    if (dir === 'flat') a = 'Clicks flat at ' + n0(m.clicks);
    else if (f === 'double') a = 'Clicks ' + (m.delta > 0 ? 'doubled' : 'halved');
    else if (f) a = 'Clicks ' + dir + ' ' + f;
    else a = 'Clicks ' + dir + ' ' + Math.round(mag) + '%';
  }

  var blind = m.rows.filter(function (r) { return r.ranking === 0 && r.tracked > 0; });
  var falling = m.rows.filter(function (r) { return r.vs != null && r.vs <= -20; });
  var thin = m.rows.filter(function (r) { return r.weeks != null && r.weeks < 3.5; });
  var b = null;
  if (blind.length === 1) b = 'and still nothing ranks at ' + blind[0].short;
  else if (blind.length > 1) b = 'and nothing ranks at ' + blind.length + ' of ' + m.siteCount + ' properties';
  else if (falling.length) b = 'but ' + falling[0].short + ' fell ' + Math.abs(falling[0].vs) + '%';
  else if (thin.length) b = 'and ' + thin[0].short + ' is ' + thin[0].weeks.toFixed(1) + ' weeks from an empty queue';

  return b ? a + ', ' + b : a;
}

function chartNote(m) {
  if (!m.series.length) return 'No ranking history yet.';
  var first = m.series[0], last = m.series[m.series.length - 1];
  var dir = last.value < first.value ? 'improved' : last.value > first.value ? 'slipped' : 'held';
  var s1 = 'The group mean ' + dir + ' from ' + first.value.toFixed(1) + ' to ' + last.value.toFixed(1) +
           ' across ' + m.series.length + ' days.';
  var better = m.rows.filter(function (r) { return r.pos != null && r.prevPos != null && r.pos < r.prevPos; }).length;
  var comparable = m.rows.filter(function (r) { return r.pos != null && r.prevPos != null; }).length;
  var s2 = better + ' of ' + comparable + ' properties improved their own 28-day average.';
  var s3 = 'Only ' + m.ranking + ' of ' + m.tracked + ' tracked keywords return a result at all.';
  return s1 + ' ' + s2 + ' ' + s3;
}

function alertContent(m) {
  var blind = m.rows.filter(function (r) { return r.ranking === 0 && r.tracked > 0; });
  var primary = blind[0] || m.rows.filter(function (r) { return r.vs != null && r.vs < 0; })[0] || null;
  if (!primary) return null;

  var head, meta = [];
  if (primary.ranking === 0) {
    head = primary.label + ' was shown ' + n0(primary.impr) + ' times, clicked ' + n0(primary.clicks) +
           ', and none of its ' + primary.tracked + ' tracked keywords rank.';
  } else {
    head = primary.label + ' lost ' + Math.abs(primary.vs) + '% of its clicks, ' +
           n0(primary.prevClicks) + ' down to ' + n0(primary.clicks) + '.';
  }
  if (primary.prevClicks != null) meta.push('clicks ' + primary.prevClicks + ' → ' + primary.clicks);
  if (primary.sessions == null) meta.push('no GA4 property connected');

  var watch = [];
  m.rows.forEach(function (r) {
    if (r === primary || watch.length >= 2) return;
    // Impressions climbing while clicks do not is a CTR problem, not a
    // visibility one, and it is the failure most easily missed.
    if (r.prevImpr && r.impr / r.prevImpr >= 1.25 && r.vs != null && r.vs <= 5 && r.ctr != null && r.prevCtr) {
      watch.push({
        name: r.short,
        text: 'impressions ' + pctStr(Math.round((r.impr - r.prevImpr) / r.prevImpr * 100)) +
              ', clicks ' + (Math.abs(r.vs) <= 2 ? 'flat' : pctStr(r.vs)) +
              '; CTR ' + (r.ctr < r.prevCtr ? 'fell' : 'rose') + ' from ' + r.prevCtr + '% to ' + r.ctr + '%.'
      });
    }
  });
  var thinnest = m.rows.filter(function (r) { return r.weeks != null && r !== primary; })
                       .sort(function (a, b) { return a.weeks - b.weeks; })[0];
  if (thinnest && watch.length < 2 && thinnest.weeks < 4) {
    watch.push({ name: thinnest.short, text: thinnest.weeks.toFixed(1) + ' weeks of queue left, thinnest in the group.' });
  }
  m.rows.forEach(function (r) {
    if (watch.length >= 2 || r === primary) return;
    if (r.ranking / Math.max(1, r.tracked) < 0.15) {
      watch.push({ name: r.short, text: 'only ' + r.ranking + ' of ' + r.tracked + ' tracked keywords rank.' });
    }
  });

  return { head: head, meta: meta.join(' · '), watch: watch };
}

/* ---------- chart ---------- */

function chartSvg(series) {
  if (series.length < 2) return '';
  var W = 420, H = 132, TOP = 12, BOT = 118;
  var vals = series.map(function (p) { return p.value; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var pad = (hi - lo) * 0.12 || 1;
  lo -= pad; hi += pad;
  // y grows with the position number, so a falling number climbs the chart.
  // The Better/Worse gutter is what makes that legible.
  var pts = series.map(function (p, i) {
    var x = series.length === 1 ? 0 : i / (series.length - 1) * W;
    var y = TOP + (p.value - lo) / (hi - lo) * (BOT - TOP);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" ' +
         'preserveAspectRatio="none" style="display:block" role="img" ' +
         'aria-label="Average position over ' + series.length + ' days">' +
         '<line x1="0" y1="0" x2="' + W + '" y2="0" stroke="var(--hair-tint)" stroke-width="1"></line>' +
         '<line x1="0" y1="66" x2="' + W + '" y2="66" stroke="var(--hair-tint)" stroke-width="1"></line>' +
         '<line x1="0" y1="131" x2="' + W + '" y2="131" stroke="var(--divider)" stroke-width="1"></line>' +
         '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
         'vector-effect="non-scaling-stroke"></polyline></svg>';
}

/* ---------- render ---------- */

function render(d) {
  var m = derive(d);
  var alert = alertContent(m);
  var series = m.series;
  var first = series[0], last = series[series.length - 1];

  var genDate = new Date(m.generated + 'T00:00:00Z');
  var ageDays = Math.floor((Date.now() - genDate.getTime()) / 86400000);
  var stale = ageDays > 8;

  var acting = m.rows.filter(function (r) { return r.acting; });
  var steady = m.rows.filter(function (r) { return !r.acting; });

  function rowHtml(r, isLast) {
    return '<div class="trow prow' + (isLast ? ' last' : '') + '">' +
      '<div><div class="pname">' + esc(r.label) + '</div><div class="psub">' +
        (r.sessions == null ? 'no GA4' : n0(r.sessions) + ' sessions') +
        ' · ' + r.ranking + ' of ' + r.tracked + ' keywords ranking' +
        (r.weeks != null ? '<span class="psub-queue"> · ' + r.weeks.toFixed(1) + ' wk queue</span>' : '') +
      '</div></div>' +
      '<div class="col-share"><div class="track"><div class="fill' + (r.acting ? ' acting' : '') +
        '" style="width:' + r.share + '%"></div></div></div>' +
      '<div class="pclicks mono num right">' + n0(r.clicks) + '</div>' +
      '<div class="pvs num right' + (r.vs != null && r.vs < 0 ? ' bad' : '') + '">' +
        (r.vs == null ? '—' : pctStr(r.vs)) + '</div>' +
      '<div class="pqueue num right col-queue' + (r.weeks != null && r.weeks < 3.5 ? ' thin' : '') + '">' +
        (r.weeks == null ? '—' : r.weeks.toFixed(1) + ' wk') + '</div>' +
    '</div>';
  }

  var html = '';

  html += '<div class="masthead">' +
    '<div class="masthead-left">' +
      '<img src="assets/wordmark-light.svg" alt="Compass Group">' +
      '<div class="vrule"></div>' +
      '<div class="masthead-title mono">Search performance</div>' +
    '</div>' +
    '<div class="chips">' +
      '<span class="chip">' + m.siteCount + ' properties</span>' +
      '<span class="chip">last 28 days</span>' +
      '<span class="chip-date">' + genDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) + '</span>' +
    '</div></div>';

  html += '<div class="split hero">' +
    '<img class="watermark" src="assets/mark-ink.svg" alt="">' +
    '<div class="hero-left">' +
      '<div class="kicker"></div>' +
      '<div class="headline mono">' + esc(headline(m)) + '</div>' +
      '<div class="metrics">' +
        '<div><div class="lead-row">' +
          '<div class="lead mono num">' + n0(m.clicks) + '</div>' +
          (m.delta == null ? '' : '<div class="delta-chip">' + pctStr(Math.round(m.delta)) + '</div>') +
        '</div>' +
        '<div class="caption">Search clicks · ' + n0(m.prevClicks) + ' prior</div></div>' +
        '<div class="secondaries">' +
          '<div class="secondary"><div class="secondary-val mono num">' + n0(m.impr) + '</div>' +
            '<div class="caption">Impressions</div></div>' +
          '<div class="secondary"><div class="secondary-val mono num">' + n0(m.sessions) + '</div>' +
            '<div class="caption">Sessions</div></div>' +
          '<div class="secondary"><div class="secondary-val mono num">' + m.ranking +
            '<span class="secondary-den">/' + m.tracked + '</span></div>' +
            '<div class="caption">Keywords ranking</div></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="divider"></div>' +
    '<div class="hero-right">' +
      '<div class="chart-head"><div class="chart-label mono">Average position</div>' +
        '<div class="chart-hint">lower is better</div></div>' +
      (series.length ?
        '<div class="chart-value-row"><span class="chart-value mono num">' + last.value.toFixed(1) + '</span>' +
          '<span class="chart-from">from ' + first.value.toFixed(1) + ' on ' + fmtDate(first.date) + '</span></div>' +
        '<div class="chart-grid">' +
          '<div class="chart-gutter"><span>Better</span><span>Worse</span></div>' +
          '<div>' + chartSvg(series) +
            '<div class="chart-dates"><span>' + fmtDate(first.date) + '</span><span>' + fmtDate(last.date) + '</span></div>' +
          '</div>' +
        '</div>' : '<div class="chart-from">No ranking history yet.</div>') +
      '<div class="chart-note">' + esc(chartNote(m)) + '</div>' +
    '</div>' +
  '</div>';

  if (alert) {
    html += '<div class="split alert">' +
      '<div class="alert-left"><div class="alert-bar"></div><div>' +
        '<div class="alert-label mono">Needs attention</div>' +
        '<div class="alert-headline mono">' + esc(alert.head) + '</div>' +
        (alert.meta ? '<div class="alert-meta">' + esc(alert.meta) + '</div>' : '') +
      '</div></div>' +
      '<div class="divider"></div>' +
      '<div class="alert-right"><div class="watch-label mono">Also watch</div>' +
        '<div class="watch-list">' +
          alert.watch.map(function (w) {
            return '<div class="watch-row"><span class="watch-dash">—</span>' +
              '<span><span class="watch-name">' + esc(w.name) + '</span> ' + esc(w.text) + '</span></div>';
          }).join('') +
        '</div></div>' +
    '</div>';
  }

  html += '<div class="table">' +
    '<div class="trow thead mono"><div>Property</div><div class="col-share">Share of clicks</div>' +
      '<div class="right">Clicks</div><div class="right">vs prev</div>' +
      '<div class="right col-queue">Queue left</div></div>';
  if (acting.length) {
    html += '<div class="group"><span class="group-tick"></span>' +
      '<span class="group-name mono">Acting on</span></div>';
    html += acting.map(function (r) { return rowHtml(r, false); }).join('');
  }
  if (steady.length) {
    html += '<div class="group steady"><span class="group-tick"></span>' +
      '<span class="group-name mono">Steady</span></div>';
    html += steady.map(function (r, i) { return rowHtml(r, i === steady.length - 1); }).join('');
  }
  html += '</div>';

  html += '<div class="panels">' +
    '<div class="panel-l"><div class="panel-title mono">Quick wins · position 4–20</div>' +
      '<div class="wins">' +
        (m.wins.length ? m.wins.map(function (w, i) {
          return '<div class="win"><span class="win-rank mono">' + ('0' + (i + 1)).slice(-2) + '</span>' +
            '<span>' + esc(w.q) + '</span>' +
            '<span class="win-fig num">' + n0(w.impr) + ' impr · ' + w.pos + '</span></div>';
        }).join('') : '<div class="chart-from">Nothing ranking between 4 and 20 yet.</div>') +
      '</div></div>' +
    '<div class="divider"></div>' +
    '<div class="panel-r"><div class="panel-title mono">Where the sessions came from</div>' +
      '<div class="sources">' +
        m.channels.map(function (c) {
          var organic = /organic search/i.test(c.name);
          return '<div><div class="source-head"><span>' + esc(c.name) + '</span>' +
            '<span class="source-val num">' + n0(c.sessions) + ' · ' + Math.round(c.pct) + '%</span></div>' +
            '<div class="source-track"><div class="source-fill' + (organic ? ' organic' : '') +
            '" style="width:' + Math.max(1, Math.min(100, c.pct)).toFixed(1) + '%"></div></div></div>';
        }).join('') +
      '</div></div>' +
  '</div>';

  html += '<div class="foot">' +
    '<span>Search Console · GA4 on ' + m.sitesWithGa4 + ' of ' + m.siteCount + ' properties</span>' +
    '<span>' + (stale ? '<span class="stale">Data is ' + ageDays + ' days old</span> · ' : 'Console data lags about three days · ') +
      'generated ' + genDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) + '</span>' +
  '</div>';

  document.getElementById('sheet').innerHTML = html;
}

fetch('data.json', { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (d) { D = d; render(d); })
  .catch(function (e) {
    document.getElementById('msg').textContent =
      'Could not load data.json — ' + e.message + '. If this page was just deployed, it may be one build behind; reload in a minute.';
  });
</script>
</body>
</html>
